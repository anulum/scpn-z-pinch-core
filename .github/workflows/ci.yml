# SCPN Z-Pinch Core — correctness gate

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Lint, typing, tests, domain checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install pinned toolchain
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy strict
        run: mypy --strict tools tests
      - name: Tests with complete coverage
        run: pytest -q --cov=tools --cov-branch --cov-fail-under=100
      - name: Reactor domain manifest
        run: python tools/validate_reactor_domain.py reactor-domain.json
      - name: Studio descriptor drift
        run: python tools/derive_studio_descriptor.py --check
      - name: Capability inventory drift
        run: python tools/generate_capability_inventory.py --check
      - name: Documentation links
        run: python tools/preflight.py --only docs
