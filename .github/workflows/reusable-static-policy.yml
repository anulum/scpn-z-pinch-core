# SCPN Z-Pinch Core — static analysis and repository policy (reusable)

name: Static analysis and policy

on:
  workflow_call:

permissions: {}

jobs:
  run:
    name: Lint, typing, domain policy, workflow guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
      - name: Install the hash-locked toolchain and kernel library
        run: python -m pip install --require-hashes -r requirements-dev.txt -r requirements-kernels.txt
      - name: Install the package itself (dependencies come from the locks)
        run: python -m pip install --no-deps -e .
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy strict
        run: mypy --strict src tools tests benchmarks
      - name: Reactor domain manifest
        run: python tools/validate_reactor_domain.py reactor-domain.json
      - name: Studio descriptor drift
        run: python tools/derive_studio_descriptor.py --check
      - name: Capability inventory drift
        run: python tools/generate_capability_inventory.py --check
      - name: Workflow modularity guard
        run: python tools/audit_workflows.py
