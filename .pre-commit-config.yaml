# SCPN Z-Pinch Core — pre-commit hooks (repository-local, pinned via .venv)

default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: '^LICENSES/'
      - id: trailing-whitespace
        exclude: '^LICENSES/'
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: commit-trailers
        name: seat/authorship commit-message guard
        entry: .venv/bin/python tools/check_commit_trailers.py
        language: system
        stages: [commit-msg]
      - id: preflight-pre-push
        name: full preflight gate before push
        entry: .venv/bin/python tools/preflight.py
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: .venv/bin/ruff format --check --force-exclude
        language: system
        types: [python]
      - id: mypy-strict
        name: mypy strict
        entry: .venv/bin/mypy --strict src tools tests
        language: system
        pass_filenames: false
        types: [python]
      - id: reactor-domain-validate
        name: reactor domain manifest validation
        entry: .venv/bin/python tools/validate_reactor_domain.py reactor-domain.json
        language: system
        pass_filenames: false
        files: ^(reactor-domain\.json|tools/validate_reactor_domain\.py)$
      - id: studio-descriptor-drift
        name: studio descriptor drift check
        entry: .venv/bin/python tools/derive_studio_descriptor.py --check
        language: system
        pass_filenames: false
        files: ^(reactor-domain\.json|studio/portfolio-descriptor\.json|tools/derive_studio_descriptor\.py)$
      - id: capability-inventory-drift
        name: capability inventory drift check
        entry: .venv/bin/python tools/generate_capability_inventory.py --check
        language: system
        pass_filenames: false
        files: ^(reactor-domain\.json|capability-inventory\.json|tools/generate_capability_inventory\.py)$
