# SCPN Z-Pinch Core — package and validation tooling configuration

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scpn-z-pinch-core"
description = "Device configuration model of the SCPN-Z-PINCH-CORE device family"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dynamic = ["version"]
# The shared kernel library is pinned to one commit object of its public
# repository (no release exists yet); the same commit and the digest of its
# kernel inventory are recorded in reactor-domain.json (kernel_library) and
# a contract test proves the two pins agree.
dependencies = [
    "scpn-reactor-kernels[cad] @ git+https://github.com/anulum/scpn-reactor-kernels.git@706a5979450c06432b17f080ecfa9d7cebaa435f",
]

[tool.setuptools.dynamic]
version = { attr = "scpn_z_pinch_core.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scpn_z_pinch_core = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# The provenance header intentionally uses an en dash in the copyright range.
allowed-confusables = ["–"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # bugbear
    "A",   # builtins shadowing
    "C4",  # comprehensions
    "SIM", # simplification
    "ARG", # unused arguments
    "PTH", # pathlib usage
    "RUF", # ruff-specific
    "S",   # bandit-class security rules
    "PL",  # pylint
    "PERF",# performance anti-patterns
    "FBT", # boolean traps
    "ISC", # implicit string concatenation
    "PT",  # pytest style
    "RET", # return simplification
    "SLF", # private member access
    "DTZ", # naive datetimes
    "PIE", # misc lints
    "C90", # mccabe complexity
    "FURB",# modernisation
    "LOG", # logging defects
    "G",   # logging format
    "YTT", # sys.version misuse
    "EXE", # shebang and executable bits
    "ICN", # import conventions
    "INT", # gettext
    "TID", # tidy imports
    "FLY", # static join
    "NPY", # numpy legacy
    "Q",   # quote consistency
    "TRY", # exception anti-patterns
    "ANN", # missing annotations
]
# Rules deliberately NOT adopted, each with the reason it is wrong here
# rather than merely inconvenient. A rule silenced without a reason is debt;
# a rule silenced with one is a decision.
ignore = [
    # TRY003 demands short, generic exception messages. Every refusal in this
    # repository deliberately names the offending field and its value,
    # because that message is load-bearing evidence for the caller.
    "TRY003",
    # TRY004 asks for TypeError when an isinstance check fails. The group's
    # convention is a domain error naming the field, never a builtin type
    # error; honouring it would make the codebase less consistent, not more.
    "TRY004",
    # ANN401 forbids `Any`. Where it fires, the annotation covers a
    # third-party surface that ships no type information, and a narrower
    # annotation would be a lie.
    "ANN401",
    # PLR2004 flags comparisons against small integers that are tuple
    # arities here; naming them would obscure rather than explain.
    "PLR2004",
    # PLC0415 forbids imports inside functions. The optional back-ends are
    # loaded lazily on purpose and the benchmarks import their subject after
    # timer setup on purpose; both are design decisions.
    "PLC0415",
    # PERF401 rewrites a filtered append loop into list.extend; where it
    # fires the loop body builds a multi-line message and the comprehension
    # form is less readable for no measurable gain.
    "PERF401",
    # TC001/TC002/TC003 move imports under TYPE_CHECKING. The runtime needs
    # several of these annotations, so the move trades a real risk for no
    # benefit at this size.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.mccabe]
# Ratchet at the measured ceiling of this repository: it passes today and
# forbids anything worse. The outliers it records are the observability plan
# validators, whose __post_init__ checks one declared field per branch, the
# record parser, and the manifest validators under tools/. They are
# registered as candidates for decomposition in the group's quality register
# rather than silently normalised.
max-complexity = 22

[tool.ruff.lint.pylint]
max-args = 6
max-positional-args = 6
max-branches = 21
max-statements = 52

[tool.ruff.lint.per-file-ignores]
# assert is the pytest contract surface
"tests/*" = ["S101"]
# a parametrised test receives its boolean case from pytest, which supplies
# every parameter by name, so the signature cannot be keyword-only and the
# boolean is the case under test rather than a flag a caller might confuse
# (scope of FBT001)
"tests/test_observability_transformations.py" = ["FBT001"]
# the STEP round trip re-imports the export in a separate reader process
# (the consumer scenario): a fixed argument vector with the test's own
# interpreter and a tmp_path file, without a shell and without untrusted
# input (scope of S603)
"tests/test_geometry_cad.py" = ["S101", "S603"]
# preflight executes fixed argument vectors of repository gates without a
# shell and without untrusted input (scope of S603/S607)
"tools/preflight.py" = ["S603", "S607"]
# the benchmark records the commit with a fixed git argument vector resolved
# through shutil.which, without a shell and without untrusted input
"benchmarks/level0_physics.py" = ["S603"]
"benchmarks/device_model_3d.py" = ["S603"]
"benchmarks/device_model_cad.py" = ["S603"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = [
    "scpn_z_pinch_core",
    "check_commit_trailers",
    "manifest_io",
    "validate_reactor_domain",
    "derive_studio_descriptor",
    "generate_capability_inventory",
    "preflight",
    "geometry_fixtures",
    "observability_fixtures",
]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
pretty = true
mypy_path = ["tools", "src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["tools", "src"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ['if __name__ == "__main__":']
