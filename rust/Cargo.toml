# SCPN Z-Pinch Core — native level-0 physics kernels

[package]
name = "scpn-z-pinch-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "Native level-0 device-physics kernels of SCPN Z-Pinch Core, bit-exact with the Python floor"
publish = false

[lib]
name = "scpn_z_pinch_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

[profile.release]
codegen-units = 1
lto = "fat"
