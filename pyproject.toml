# SCPN Z-Pinch Core — validation tooling configuration
#
# This file configures the repository's Python-based validation tooling only.
# No distributable domain package exists at architecture-only maturity, so no
# [project] metadata, entry points, or runtime dependencies are declared.

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# The provenance header intentionally uses an en dash in the copyright range.
allowed-confusables = ["–"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # bugbear
    "A",   # builtins shadowing
    "C4",  # comprehensions
    "SIM", # simplification
    "ARG", # unused arguments
    "PTH", # pathlib usage
    "RUF", # ruff-specific
    "S",   # bandit-class security rules
]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest contract surface
"tests/*" = ["S101"]
# preflight executes fixed argument vectors of repository gates without a
# shell and without untrusted input (scope of S603/S607)
"tools/preflight.py" = ["S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = [
    "check_commit_trailers",
    "manifest_io",
    "validate_reactor_domain",
    "derive_studio_descriptor",
    "generate_capability_inventory",
    "preflight",
]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
pretty = true
mypy_path = "tools"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["tools"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ['if __name__ == "__main__":']
